<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPilot</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#e8edf7}main{max-width:1100px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151d33;border:1px solid #273252;border-radius:14px;padding:18px}.muted{color:#91a0bd}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #26304a}button{background:#5b7cfa;color:white;border:0;border-radius:8px;padding:10px 14px}</style></head><body><main><h1>OpsPilot</h1><p class="muted">Linux incident detection & auto-remediation</p><button onclick="scan()">Run scan</button><section class="grid" style="margin-top:24px"><div class="card">CPU<h2 id="cpu">—</h2></div><div class="card">Memory<h2 id="mem">—</h2></div><div class="card">Disk<h2 id="disk">—</h2></div><div class="card">Processes<h2 id="proc">—</h2></div></section><div class="card" style="margin-top:20px"><h3>Incident timeline</h3><table><thead><tr><th>ID</th><th>Severity</th><th>Category</th><th>Status</th><th>Summary</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function load(){let m=await fetch('/api/metrics').then(r=>r.json());cpu.textContent=m.cpu_percent.toFixed(1)+'%';mem.textContent=m.memory_percent.toFixed(1)+'%';disk.textContent=m.disk_percent.toFixed(1)+'%';proc.textContent=m.process_count;let x=await fetch('/api/incidents').then(r=>r.json());rows.innerHTML=x.map(i=>'<tr><td>#'+i.id+'</td><td>'+i.severity+'</td><td>'+i.category+'</td><td>'+i.status+'</td><td>'+i.summary+'</td></tr>').join('')||'<tr><td colspan="5">No incidents</td></tr>'}async function scan(){await fetch('/api/scan',{method:'POST'});load()}load();setInterval(load,10000)</script></body></html>
